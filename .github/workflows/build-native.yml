name: Native builds

# Unsigned builds until the Apple and Google accounts exist (roadmap 8.5a, docs/release.md):
# an installable Android debug APK and an iOS simulator build that proves the project compiles.
# Called by the release workflow for every release; versions come from package.json.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-native.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: pnpm build
      - run: pnpm exec cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: grynd-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm exec cap sync ios

      # Same scheme as versionCode in android/app/build.gradle: major * 1000000 + minor * 1000 + patch.
      - name: Read the version from package.json
        run: |
          version=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "${version%%-*}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"

      # Simulator build: no signing needed, proves the project and its Swift packages compile.
      - name: Build for the iOS simulator
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          MARKETING_VERSION="$VERSION"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          build
