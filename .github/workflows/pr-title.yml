name: PR title

# PRs are squash-merged with the PR title as the commit subject, so the title is what lands on main,
# drives the version bump and becomes the changelog line (docs/release.md, «Versionierung»).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            refactor
            docs
            style
            test
            build
            ci
            chore
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: >-
            The subject "{subject}" of the PR title "{title}" must start lowercase and must not end with a period.
