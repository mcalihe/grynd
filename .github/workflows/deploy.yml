name: Deploy

# Web build over FTPS (docs/release.md, «Web-Deployment»):
# - production: releases only. After CI passed on main for a release commit (the merged release PR),
#   or manually from main to redeploy the latest release → httpdocs/ of the production FTP user
# - staging: every push to main after CI passed → httpdocs/main/ of the preview FTP user
# - preview: every PR from this repo → httpdocs/pr-<n>/ of the preview FTP user, removed when the PR closes.
#   Not for the release PR: it only bumps the version and CHANGELOG.md, so it would match staging.
# Each GitHub environment holds FTP_HOST, FTP_USER, FTP_PASSWORD (secrets) and SITE_URL (variable).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  # Decides what a green CI run on main (or a manual run) deploys. A workflow_run job always runs as
  # main, so the environment's branch rule cannot tell where head_sha came from (a tag named "main"
  # also matches the branch filter); the commit must therefore be on main.
  main-gate:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      production: ${{ steps.check.outputs.production }}
      staging: ${{ steps.check.outputs.staging }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          version_at() {
            gh api -H 'Accept: application/vnd.github.raw' "$repo/contents/package.json?ref=$1" --jq .version
          }

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            echo "::notice::Redeploying the latest release $tag."
            echo "production=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main=$(gh api "$repo/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "$repo/compare/$SHA...$main" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::notice::Not deploying $SHA: it is not on main."
            exit 0
          fi

          # Staging follows the tip of main; if main has moved on, the newer commit's CI run deploys.
          if [ "$SHA" = "$main" ]; then
            echo "staging=$SHA" >> "$GITHUB_OUTPUT"
          fi

          # Production takes release commits (the release PR bumps the version) that are still the
          # latest release, so a slow run of an older release cannot overwrite a newer one.
          version=$(version_at "$SHA")
          parent=$(gh api "$repo/commits/$SHA" --jq '.parents[0].sha')
          if [ "$version" != "$(version_at "$parent")" ] && [ "$version" = "$(version_at "$main")" ]; then
            echo "::notice::Deploying release $version to production."
            echo "production=$SHA" >> "$GITHUB_OUTPUT"
          fi

  production:
    needs: main-gate
    if: needs.main-gate.outputs.production != ''
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.main-gate.outputs.production }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - run: sed 's|__BASE__|/|' deploy/app.htaccess > dist/grynd/browser/.htaccess
      - run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - run: bash scripts/deploy-ftp.sh dist/grynd/browser httpdocs
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  # The current state of main, between releases. Shares the preview database with the PR previews.
  staging:
    needs: main-gate
    if: needs.main-gate.outputs.staging != ''
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ vars.SITE_URL }}/main/
    concurrency:
      group: deploy-preview-main
      cancel-in-progress: true
    env:
      BASE_HREF: /main/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.main-gate.outputs.staging }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Build label (src/app/core/app-info.ts): version 0.4.0+main.abc1234, tab title «main · Grynd»
      - run: pnpm build --base-href "$BASE_HREF" --define "GRYND_BUILD='main.${SHA:0:7}'"
        env:
          SHA: ${{ needs.main-gate.outputs.staging }}

      - run: sed "s|__BASE__|$BASE_HREF|" deploy/app.htaccess > dist/grynd/browser/.htaccess
      - run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - run: bash scripts/deploy-ftp.sh dist/grynd/browser "httpdocs$BASE_HREF"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  preview:
    # Fork PRs get no secrets, so they get no preview. The release PR (release-please branch) gets none
    # either: it differs from main only in the version number, and main is already on staging.
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ vars.SITE_URL }}/pr-${{ github.event.pull_request.number }}/
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      BASE_HREF: /pr-${{ github.event.pull_request.number }}/
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - id: url
        run: echo "url=$SITE_URL$BASE_HREF" >> "$GITHUB_OUTPUT"
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Build label (src/app/core/app-info.ts): version 0.4.0+pr-31.abc1234, tab title «pr-31 · Grynd»
      - run: pnpm build --base-href "$BASE_HREF" --define "GRYND_BUILD='pr-$PR_NUMBER.${SHA:0:7}'"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}

      - run: sed "s|__BASE__|$BASE_HREF|" deploy/app.htaccess > dist/grynd/browser/.htaccess
      - run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Upload preview root (redirect to production, noindex)
        run: |
          mkdir -p preview-root
          cp deploy/preview-root.htaccess preview-root/.htaccess
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\"; put -O httpdocs preview-root/.htaccess"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - run: bash scripts/deploy-ftp.sh dist/grynd/browser "httpdocs$BASE_HREF"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  preview-cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: deploy-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - run: sudo apt-get update -q && sudo apt-get install -y -q lftp
      - name: Remove httpdocs/pr-${{ github.event.pull_request.number }}
        run: |
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\"; rm -r -f httpdocs/pr-$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

  # One sticky comment per PR with the preview link, updated on every deploy and on close.
  # Separate job without checkout: the token that may write comments never sees PR code.
  preview-comment:
    needs: [preview, preview-cleanup]
    if: always() && (needs.preview.result == 'success' || needs.preview-cleanup.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.preview.outputs.url }}
          CLOSED: ${{ github.event.action == 'closed' }}
        run: |
          marker='<!-- grynd-preview -->'
          if [ "$CLOSED" = true ]; then
            body="$marker"$'\n'"**Preview removed** (PR closed)."
          else
            body="$marker"$'\n'"**Preview:** $URL"$'\n\n'"Commit \`${SHA:0:7}\` · deployed $(date -u '+%Y-%m-%d %H:%M') UTC"
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
