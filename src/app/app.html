<div class="flex min-h-dvh flex-col pt-safe px-safe">
  <main class="flex flex-1 flex-col">
    <router-outlet />
  </main>

  @if (showNav()) {
    <div class="sticky bottom-0 bg-background pt-2 pb-[calc(env(safe-area-inset-bottom)+16px)]">
      <app-bottom-navigation />
    </div>
  }
</div>

<!-- Loaded after startup: keeps the CDK overlay out of the initial bundle. -->
@defer (on idle) {
  <app-confirm-dialog-host />
  <hlm-toaster position="top-center" [theme]="theme.resolved()" />
}
